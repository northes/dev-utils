<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>软件更新</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#111113;color:#f4f4f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111113}.update{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px;min-height:100vh;padding:28px}.hero{display:flex;align-items:center;gap:14px}.icon{display:grid;place-items:center;width:42px;height:42px;border:1px solid #343438;border-radius:10px;background:#1b1b1f;color:#77a7ff;font-size:22px}.head{min-width:0}.head h1{margin:0 0 5px;font-size:18px;font-weight:650}.subtitle{color:#96969f;font-size:12px}.content{min-height:0}.status{color:#a7a7b0;font-size:12px}.notes{display:none;height:100%;overflow:auto;padding:12px 14px;border:1px solid #2b2b30;border-radius:8px;background:#17171a;color:#c8c8ce;font-size:12px;line-height:1.65;white-space:pre-wrap}.progress{display:none}.progress-row{display:flex;justify-content:space-between;margin-bottom:10px;color:#a7a7b0;font-size:11px}.bar{width:100%;height:7px;accent-color:#4f8cff}.error{display:none;padding:12px 14px;border:1px solid #62333a;border-radius:8px;background:#25171a;color:#ffadb8;font-size:12px;line-height:1.55}.footer{display:flex;justify-content:space-between;gap:8px;padding-top:16px;border-top:1px solid #29292e}.actions{display:flex;gap:8px}.button{height:32px;padding:0 13px;border:1px solid #38383e;border-radius:7px;background:#1b1b1f;color:#e8e8eb;font:500 12px inherit;cursor:pointer}.button:hover{background:#242429}.button.primary{border-color:#4f8cff;background:#4f8cff;color:#fff}.button.ghost{border-color:transparent;background:transparent;color:#a7a7b0}.button{display:none}.update[data-state=available] .notes,.update[data-state=ready] .notes{display:block}.update[data-state=downloading] .progress{display:block}.update[data-state=error] .error{display:block}.update[data-state=available] [data-show~=available],.update[data-state=downloading] [data-show~=downloading],.update[data-state=ready] [data-show~=ready],.update[data-state=up-to-date] [data-show~=up-to-date],.update[data-state=error] [data-show~=error]{display:inline-flex;align-items:center;justify-content:center}.update[data-state=available] .status,.update[data-state=ready] .status,.update[data-state=downloading] .status,.update[data-state=error] .status{display:none}
</style>
</head>
<body>
<main class="update" id="root" data-state="checking" data-wails-updater-window="1">
  <header class="hero"><div class="icon" id="icon">↻</div><div class="head"><h1 id="title">正在检查更新…</h1><div class="subtitle" id="subtitle"></div></div></header>
  <section class="content">
    <div class="status" id="status">正在连接 GitHub Releases…</div>
    <div class="notes" id="notes"></div>
    <div class="progress"><div class="progress-row"><span id="progress-text">正在下载…</span><span id="progress-rate"></span></div><progress class="bar" id="bar" max="100"></progress></div>
    <div class="error" id="error">检查更新时发生错误。</div>
  </section>
  <footer class="footer"><div class="actions"><button class="button ghost" data-show="available" id="skip">跳过此版本</button><button class="button ghost" data-show="available" id="remind">稍后提醒</button></div><div class="actions"><button class="button" data-show="available downloading ready up-to-date error" id="close">关闭</button><button class="button primary" data-show="available" id="install">安装更新</button><button class="button primary" data-show="ready" id="restart">重启并应用</button><button class="button primary" data-show="error" id="retry">重试</button></div></footer>
</main>
<script>
(function(){
  var Events=window.wails.Events;
  var root=document.getElementById('root'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),status=document.getElementById('status'),notes=document.getElementById('notes'),icon=document.getElementById('icon'),bar=document.getElementById('bar'),progressText=document.getElementById('progress-text'),progressRate=document.getElementById('progress-rate'),error=document.getElementById('error');
  var currentVersion='',release=null,rank=0,errored=false;
  var ranks={checking:1,available:2,downloading:3,verifying:4,installing:5,ready:6,'up-to-date':6,error:99};
  var icons={checking:'↻',available:'↓',downloading:'↓',verifying:'✓',installing:'↓',ready:'✓','up-to-date':'✓',error:'!'};
  function payload(e){return e&&e.data!=null?e.data:e}
  function state(name){if(errored&&name!=='error')return false;if(name==='error')errored=true;else if((ranks[name]||0)<rank)return false;else rank=ranks[name]||0;root.dataset.state=name;icon.textContent=icons[name]||'';return true}
  function bytes(n){if(!n||n<=0)return'';var u=['B','KB','MB','GB'],i=Math.min(3,Math.floor(Math.log(n)/Math.log(1024)));return(n/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
  function versionLine(r){var parts=[];if(currentVersion)parts.push('v'+currentVersion);if(r&&r.version)parts.push('→ v'+r.version);if(r&&r.artifact&&r.artifact.size)parts.push('· '+bytes(r.artifact.size));subtitle.textContent=parts.join(' ')}
  Events.On('wails:updater:meta',function(e){var m=payload(e)||{};currentVersion=m.currentVersion||''});
  Events.On('wails:updater:check-started',function(){if(!state('checking'))return;title.textContent='正在检查更新…';status.textContent='正在连接 GitHub Releases…'});
  Events.On('wails:updater:update-available',function(e){release=payload(e)||null;if(!state('available'))return;title.textContent='发现新版本';versionLine(release);notes.textContent=release&&release.notes?release.notes:'此版本没有发布说明。'});
  Events.On('wails:updater:no-update',function(){if(!state('up-to-date'))return;title.textContent='当前已是最新版本';subtitle.textContent=currentVersion?'v'+currentVersion:'';status.textContent='暂无可用更新。'});
  Events.On('wails:updater:download-started',function(){if(!state('downloading'))return;title.textContent='正在下载更新';progressText.textContent='准备下载…';bar.removeAttribute('value')});
  Events.On('wails:updater:download-progress',function(e){var p=payload(e)||{};if(root.dataset.state!=='downloading')return;if(p.total>0){bar.max=p.total;bar.value=p.written;progressText.textContent=Math.round(p.written/p.total*100)+'% · '+bytes(p.written)+' / '+bytes(p.total)}else{bar.removeAttribute('value');progressText.textContent='已下载 '+bytes(p.written)}progressRate.textContent=p.rate?bytes(p.rate)+'/s':''});
  Events.On('wails:updater:verifying',function(){if(!state('verifying'))return;title.textContent='正在验证更新';status.textContent='正在校验下载文件…'});
  Events.On('wails:updater:installing',function(){if(!state('installing'))return;title.textContent='正在准备更新';status.textContent='正在解压并暂存应用…'});
  Events.On('wails:updater:update-ready',function(){if(!state('ready'))return;title.textContent='更新已准备好';versionLine(release);notes.textContent=release&&release.notes?release.notes:'重启应用即可完成更新。'});
  Events.On('wails:updater:error',function(e){var info=payload(e)||{};state('error');title.textContent='更新失败';error.textContent=info.message||'检查更新时发生未知错误。'});
  document.getElementById('install').onclick=function(){Events.Emit('wails:updater:user:install')};document.getElementById('skip').onclick=function(){Events.Emit('wails:updater:user:skip')};document.getElementById('remind').onclick=function(){Events.Emit('wails:updater:user:remind')};document.getElementById('close').onclick=function(){Events.Emit('wails:updater:user:cancel')};document.getElementById('restart').onclick=function(){Events.Emit('wails:updater:user:restart')};document.getElementById('retry').onclick=function(){Events.Emit('wails:updater:user:install')};
  (function ready(){if(window._wails&&typeof window._wails.invoke==='function'){window._wails.invoke('wails:runtime:ready');Events.Emit('wails:updater:window:ready')}else setTimeout(ready,30)})();
})();
</script>
</body>
</html>
