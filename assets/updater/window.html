<!doctype html>
<html lang="__DEVUTILS_UPDATER_LANGUAGE__" data-theme="__DEVUTILS_UPDATER_THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;--bg:#f7f7f8;--surface:#fff;--surface-hover:#ededf0;--fg:#202024;--fg-muted:#686870;--border:#d8d8de;--accent:#276bd8;--accent-hover:#1f5fc5;--accent-fg:#fff;--code-bg:#ededf0;--code-fg:#8b4f13;--error-bg:#fff1f2;--error-border:#e4a4ac;--error-fg:#b42335}:root[data-theme=default-dark]{color-scheme:dark;--bg:#111113;--surface:#17171a;--surface-hover:#242429;--fg:#f4f4f5;--fg-muted:#a7a7b0;--border:#343438;--accent:#4f8cff;--accent-hover:#679cff;--accent-fg:#fff;--code-bg:#25252a;--code-fg:#e5c07b;--error-bg:#25171a;--error-border:#62333a;--error-fg:#ffadb8}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--fg)}.update{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px;width:100%;height:100%;min-height:0;overflow:hidden;padding:28px;background:var(--bg)}.hero{display:flex;align-items:center;gap:14px;min-width:0}.icon{display:grid;place-items:center;flex:none;width:42px;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--accent);font-size:22px}.head{min-width:0}.head h1{margin:0 0 5px;font-size:18px;font-weight:650}.subtitle{color:var(--fg-muted);font-size:12px}.content{min-height:0;overflow:hidden}.status{color:var(--fg-muted);font-size:12px}.notes{display:none;height:100%;overflow:auto;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg-muted);font-size:12px;line-height:1.65;user-select:text}.notes>:first-child{margin-top:0}.notes>:last-child{margin-bottom:0}.notes h1,.notes h2,.notes h3,.notes h4,.notes h5,.notes h6{margin:1.2em 0 .45em;color:var(--fg);line-height:1.35}.notes h1{font-size:16px}.notes h2{font-size:15px}.notes h3{font-size:14px}.notes h4,.notes h5,.notes h6{font-size:13px}.notes p,.notes ul,.notes ol,.notes blockquote,.notes pre{margin:.65em 0}.notes ul,.notes ol{padding-left:1.7em}.notes li+li{margin-top:.2em}.notes blockquote{padding-left:10px;border-left:2px solid var(--accent);color:var(--fg-muted)}.notes code{padding:1px 4px;border-radius:4px;background:var(--code-bg);color:var(--code-fg);font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.notes pre{overflow:auto;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}.notes pre code{padding:0;background:transparent;color:var(--fg)}.notes a{color:var(--accent);text-decoration:none}.notes a:hover{text-decoration:underline}.notes hr{margin:1em 0;border:0;border-top:1px solid var(--border)}.progress{display:none}.progress-row{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--fg-muted);font-size:11px}.bar{width:100%;height:7px;accent-color:var(--accent)}.error{display:none;height:100%;overflow:auto;padding:12px 14px;border:1px solid var(--error-border);border-radius:8px;background:var(--error-bg);color:var(--error-fg);font-size:12px;line-height:1.55}.footer{display:flex;justify-content:space-between;gap:8px;padding-top:16px;border-top:1px solid var(--border)}.actions{display:flex;gap:8px}.button{display:none;align-items:center;justify-content:center;height:32px;padding:0 13px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:500 12px inherit;cursor:pointer}.button:hover{background:var(--surface-hover)}.button.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.button.primary:hover{background:var(--accent-hover)}.button.ghost{border-color:transparent;background:transparent;color:var(--fg-muted)}.update[data-state=available] .notes,.update[data-state=ready] .notes{display:block}.update[data-state=downloading] .progress{display:block}.update[data-state=error] .error{display:block}.update[data-state=available] [data-show~=available],.update[data-state=downloading] [data-show~=downloading],.update[data-state=ready] [data-show~=ready],.update[data-state=up-to-date] [data-show~=up-to-date],.update[data-state=error] [data-show~=error]{display:inline-flex}.update[data-state=available] .status,.update[data-state=ready] .status,.update[data-state=downloading] .status,.update[data-state=error] .status{display:none}.update[data-state=checking],.update[data-state=up-to-date],.update[data-state=error]{gap:10px;padding:16px 20px}.update[data-state=checking]{grid-template-rows:auto minmax(0,1fr)}.update[data-state=checking] .footer{display:none}.update[data-state=up-to-date]{grid-template-rows:auto auto}.update[data-state=up-to-date] .content{display:none}.update[data-state=up-to-date] .footer,.update[data-state=error] .footer{padding-top:0;border-top:0}.update[data-state=error]{grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:12px 16px}.update[data-state=error] .error{padding:8px 10px}
</style>
</head>
<body>
<main class="update" id="root" data-state="checking" data-wails-updater-window="1">
  <header class="hero"><div class="icon" id="icon" aria-hidden="true">↻</div><div class="head"><h1 id="title"></h1><div class="subtitle" id="subtitle"></div></div></header>
  <section class="content">
    <div class="status" id="status"></div>
    <div class="notes" id="notes"></div>
    <div class="progress"><div class="progress-row"><span id="progress-text"></span><span id="progress-rate"></span></div><progress class="bar" id="bar" max="100"></progress></div>
    <div class="error" id="error"></div>
  </section>
  <footer class="footer"><div class="actions"><button class="button ghost" data-show="available" id="skip"></button><button class="button ghost" data-show="available" id="remind"></button></div><div class="actions"><button class="button" data-show="available downloading ready up-to-date error" id="close"></button><button class="button primary" data-show="available" id="install"></button><button class="button primary" data-show="ready" id="restart"></button><button class="button primary" data-show="error" id="retry"></button></div></footer>
</main>
<script>
(function(){
  var Events=window.wails.Events;
  var translations=__DEVUTILS_UPDATER_TRANSLATIONS__;
  var language=document.documentElement.lang,root=document.getElementById('root'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),status=document.getElementById('status'),notes=document.getElementById('notes'),icon=document.getElementById('icon'),bar=document.getElementById('bar'),progressText=document.getElementById('progress-text'),progressRate=document.getElementById('progress-rate'),error=document.getElementById('error');
  var currentVersion='',release=null,rank=0,errored=false;
  var ranks={checking:1,available:2,downloading:3,verifying:4,installing:5,ready:6,'up-to-date':6,error:99};
  var icons={checking:'↻',available:'↓',downloading:'↓',verifying:'✓',installing:'↓',ready:'✓','up-to-date':'✓',error:'!'};
  function t(key,values){var locale=translations[language]||translations['zh-CN'],text=locale[key]||translations['zh-CN'][key]||key;Object.keys(values||{}).forEach(function(name){text=text.replace(new RegExp('\\{\\{'+name+'\\}\\}','g'),values[name])});return text}
  function payload(e){return e&&e.data!=null?e.data:e}
  function state(name){if(errored&&name!=='error')return false;if(name==='error')errored=true;else if((ranks[name]||0)<rank)return false;else rank=ranks[name]||0;root.dataset.state=name;icon.textContent=icons[name]||'';return true}
  function bytes(n){if(!n||n<=0)return'';var u=['B','KB','MB','GB'],i=Math.min(3,Math.floor(Math.log(n)/Math.log(1024)));return(n/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
  function versionLine(r){var parts=[];if(currentVersion)parts.push('v'+currentVersion);if(r&&r.version)parts.push('→ v'+r.version);if(r&&r.artifact&&r.artifact.size)parts.push('· '+bytes(r.artifact.size));subtitle.textContent=parts.join(' ')}
  function escapeHTML(value){return String(value).replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
  function inlineMarkdown(value){var code=[];value=value.replace(/`([^`\n]+)`/g,function(_,text){code.push('<code>'+escapeHTML(text)+'</code>');return'\u0000CODE'+(code.length-1)+'\u0000'});value=escapeHTML(value);value=value.replace(/!\[([^\]]*)\]\([^\s)]+(?:\s+["'][^"']*["'])?\)/g,'$1');value=value.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');value=value.replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');return value.replace(/\u0000CODE(\d+)\u0000/g,function(_,index){return code[Number(index)]})}
  function markdown(value){var lines=String(value||'').replace(/\r\n?/g,'\n').split('\n'),html=[],paragraph=[],list=null,quote=[];function flushParagraph(){if(paragraph.length){html.push('<p>'+inlineMarkdown(paragraph.join(' '))+'</p>');paragraph=[]}}function closeList(){if(list){html.push('</'+list+'>');list=null}}function flushQuote(){if(quote.length){html.push('<blockquote>'+markdown(quote.join('\n'))+'</blockquote>');quote=[]}}for(var i=0;i<lines.length;i++){var line=lines[i],match;if(/^```/.test(line)){flushParagraph();closeList();flushQuote();var languageName=line.slice(3).trim().replace(/[^a-zA-Z0-9_-]/g,''),body=[];while(++i<lines.length&&!/^```/.test(lines[i]))body.push(lines[i]);html.push('<pre><code'+(languageName?' class="language-'+languageName+'"':'')+'>'+escapeHTML(body.join('\n'))+'</code></pre>');continue}if((match=line.match(/^>\s?(.*)$/))){flushParagraph();closeList();quote.push(match[1]);continue}flushQuote();if(!line.trim()){flushParagraph();closeList();continue}if((match=line.match(/^(#{1,6})\s+(.+)$/))){flushParagraph();closeList();var level=match[1].length;html.push('<h'+level+'>'+inlineMarkdown(match[2].replace(/\s+#+\s*$/,''))+'</h'+level+'>');continue}if(/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)){flushParagraph();closeList();html.push('<hr>');continue}if((match=line.match(/^\s*[-*+]\s+(.+)$/))){flushParagraph();if(list!=='ul'){closeList();list='ul';html.push('<ul>')}html.push('<li>'+inlineMarkdown(match[1])+'</li>');continue}if((match=line.match(/^\s*\d+[.)]\s+(.+)$/))){flushParagraph();if(list!=='ol'){closeList();list='ol';html.push('<ol>')}html.push('<li>'+inlineMarkdown(match[1])+'</li>');continue}closeList();paragraph.push(line.trim())}flushParagraph();closeList();flushQuote();return html.join('')}
  function renderNotes(value,fallback){notes.innerHTML=markdown(value||t(fallback))}
  function translateControls(){document.title=t('windowTitle');document.getElementById('skip').textContent=t('skip');document.getElementById('remind').textContent=t('remind');document.getElementById('close').textContent=t('close');document.getElementById('install').textContent=t('install');document.getElementById('restart').textContent=t('restart');document.getElementById('retry').textContent=t('retry')}
  function refreshStateText(){var name=root.dataset.state;if(name==='checking'){title.textContent=t('checkingTitle');status.textContent=t('checkingStatus')}else if(name==='available'){title.textContent=t('availableTitle');versionLine(release);renderNotes(release&&release.notes,'noReleaseNotes')}else if(name==='up-to-date'){title.textContent=t('upToDateTitle');subtitle.textContent=currentVersion?'v'+currentVersion:'';status.textContent=t('upToDateStatus')}else if(name==='downloading'){title.textContent=t('downloadingTitle')}else if(name==='verifying'){title.textContent=t('verifyingTitle');status.textContent=t('verifyingStatus')}else if(name==='installing'){title.textContent=t('installingTitle');status.textContent=t('installingStatus')}else if(name==='ready'){title.textContent=t('readyTitle');versionLine(release);renderNotes(release&&release.notes,'readyFallback')}else if(name==='error'){title.textContent=t('errorTitle');if(!error.textContent)error.textContent=t('errorFallback')}}
  function applyPreferences(value){var preferences=value||{};language=preferences.language==='en-US'?'en-US':'zh-CN';document.documentElement.lang=language;document.documentElement.dataset.theme=preferences.theme==='default-light'?'default-light':'default-dark';translateControls();refreshStateText()}
  applyPreferences({language:language,theme:document.documentElement.dataset.theme});
  Events.On('devutils:updater:preferences',function(e){applyPreferences(payload(e))});
  Events.On('wails:updater:meta',function(e){var m=payload(e)||{};currentVersion=m.currentVersion||'';refreshStateText()});
  Events.On('wails:updater:check-started',function(){if(!state('checking'))return;title.textContent=t('checkingTitle');status.textContent=t('checkingStatus')});
  Events.On('wails:updater:update-available',function(e){release=payload(e)||null;if(!state('available'))return;title.textContent=t('availableTitle');versionLine(release);renderNotes(release&&release.notes,'noReleaseNotes')});
  Events.On('wails:updater:no-update',function(){if(!state('up-to-date'))return;title.textContent=t('upToDateTitle');subtitle.textContent=currentVersion?'v'+currentVersion:'';status.textContent=t('upToDateStatus')});
  Events.On('wails:updater:download-started',function(){if(!state('downloading'))return;title.textContent=t('downloadingTitle');progressText.textContent=t('preparingDownload');bar.removeAttribute('value')});
  Events.On('wails:updater:download-progress',function(e){var p=payload(e)||{};if(root.dataset.state!=='downloading')return;if(p.total>0){bar.max=p.total;bar.value=p.written;progressText.textContent=t('downloadProgress',{percent:Math.round(p.written/p.total*100),written:bytes(p.written),total:bytes(p.total)})}else{bar.removeAttribute('value');progressText.textContent=t('downloaded',{written:bytes(p.written)})}progressRate.textContent=p.rate?bytes(p.rate)+'/s':''});
  Events.On('wails:updater:verifying',function(){if(!state('verifying'))return;title.textContent=t('verifyingTitle');status.textContent=t('verifyingStatus')});
  Events.On('wails:updater:installing',function(){if(!state('installing'))return;title.textContent=t('installingTitle');status.textContent=t('installingStatus')});
  Events.On('wails:updater:update-ready',function(){if(!state('ready'))return;title.textContent=t('readyTitle');versionLine(release);renderNotes(release&&release.notes,'readyFallback')});
  Events.On('wails:updater:error',function(e){var info=payload(e)||{};state('error');title.textContent=t('errorTitle');error.textContent=info.message||t('errorFallback')});
  document.getElementById('install').onclick=function(){Events.Emit('wails:updater:user:install')};document.getElementById('skip').onclick=function(){Events.Emit('wails:updater:user:skip')};document.getElementById('remind').onclick=function(){Events.Emit('wails:updater:user:remind')};document.getElementById('close').onclick=function(){Events.Emit('wails:updater:user:cancel')};document.getElementById('restart').onclick=function(){Events.Emit('wails:updater:user:restart')};document.getElementById('retry').onclick=function(){Events.Emit('wails:updater:user:install')};
  (function ready(){if(window._wails&&typeof window._wails.invoke==='function'){window._wails.invoke('wails:runtime:ready');Events.Emit('wails:updater:window:ready')}else setTimeout(ready,30)})();
})();
</script>
</body>
</html>
